name: docs build

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "deepretro/**"
      - ".github/workflows/docs_build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "deepretro/**"
      - ".github/workflows/docs_build.yml"

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Sync docs environment
        run: |
<<<<<<< docs-build-fix
          uv sync --project deepretro --extra docs
=======
          python -m pip install --upgrade pip
          pip install sphinx sphinx-rtd-theme myst-parser structlog diskcache rdkit numpy
>>>>>>> main

      - name: Build HTML docs
        working-directory: docs
        run: uv run --project ../deepretro --no-sync sphinx-build -b html source _build/html -W --keep-going
