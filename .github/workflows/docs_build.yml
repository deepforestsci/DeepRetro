name: docs build

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "deepretro/**"
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "deepretro/**"

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sphinx sphinx-rtd-theme myst-parser structlog diskcache rdkit numpy

      - name: Build HTML docs
        run: |
          cd docs
          make html SPHINXOPTS="-W --keep-going"
