name: deepretro tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "deepretro/**"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build deepretro/

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepretro-dist-${{ matrix.python-version }}
          path: deepretro/dist/

  test:
    runs-on: ubuntu-latest
    needs: build
    environment: testing
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DEEPRETRO_METADATA_TEST_MODEL: "claude-opus-4-20250514"
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deepretro
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            pip install -e "deepretro/[dev,az]"
          else
            pip install -e "deepretro/[dev]"
          fi

      - name: Cache AiZynthFinder models
        if: matrix.python-version == '3.11'
        uses: actions/cache@v4
        with:
          path: .az_models_cache
          key: az-models-v1

      - name: Download AiZynthFinder models
        if: matrix.python-version == '3.11'
        run: |
          if [ ! -f .az_models_cache/config.yml ]; then
            mkdir -p .az_models_cache
            python -m aizynthfinder.tools.download_public_data .az_models_cache
          fi

      - name: Run tests
        env:
          AZ_TEST_MODELS_DIR: ${{ matrix.python-version == '3.11' && '.az_models_cache' || '' }}
        run: |
          if [ "${{ matrix.python-version }}" = "3.11" ]; then
            pytest deepretro/tests/ -v
          else
            pytest deepretro/tests/ -v -m "not slow"
          fi
