name: deepretro tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    paths:
      - "deepretro/**"
      - "src/protecting_group.py"
      - "src/deprotecting_group.py"
      - "docs/source/**"
      - ".github/workflows/deepretro_tests.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build deepretro/

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deepretro-dist-${{ matrix.python-version }}
          path: deepretro/dist/

  test:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11"]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install deepretro
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -e "deepretro/[dev,docs]"

      - name: Run pytest
        run: |
          pytest deepretro/tests/ -v

      - name: Run doctest
        shell: bash -el {0}
        run: |
          pytest -v --ignore-glob='deepretro/tests/test*.py' --ignore='deepretro/utils/az.py' --doctest-modules deepretro src/protecting_group.py src/deprotecting_group.py --doctest-continue-on-failure

      - name: Run Sphinx doctest
        shell: bash -el {0}
        env:
          SPHINX_DOCTEST_EXCLUDE_AZ: "1"
        run: |
          sphinx-build -b doctest docs/source docs/build/doctest
