[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepretro"
version = "0.1.0"
description = "DeepRetro package for retrosynthesis"
requires-python = ">=3.10"
dependencies = [
    "deepchem",
    "numpy",
    "rdkit",
    "structlog",
    "xgboost<2.0", # DeepChem GBDTModel uses XGBoost's sklearn wrapper; >=2.0 has breaking API changes
    "lightgbm",
    "scikit-learn",
    "pandas",
    "litellm",
    "python-dotenv",
    "langfuse<4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
]
docs = [
    "sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
    "sphinx-autodoc-typehints>=3.0",
    "myst-parser>=4.0",
]
az = [
    "aizynthfinder>=4.4.0",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "pillow",
]

[project.urls]
Repository = "https://github.com/deepforestsci/DeepRetro"

[tool.setuptools.packages.find]
where = [".."]
include = ["deepretro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ty.analysis]
replace-imports-with-any = ["rdkit.**"]
