[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepretro"
version = "0.1.0"
description = "DeepRetro package for retrosynthesis"
requires-python = ">=3.10"
dependencies = [
    "deepchem",
    "numpy",
    "rdkit",
    "structlog",
    "xgboost<2.0", # DeepChem GBDTModel uses XGBoost's sklearn wrapper; >=2.0 has breaking API changes
    "lightgbm",
    "scikit-learn",
    "pandas",
    "litellm",
    "python-dotenv",
    "langfuse<3",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
]
docs = [
    "sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
    "sphinx-autodoc-typehints>=3.0",
    "myst-parser>=4.0",
]
az = [
    "aizynthfinder>=4.4.0",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "pillow",
]
ursa = [
    "ursa @ git+https://github.com/insilicomedicine/URSA.git@b52a6576af1744320669633f9901f6704a25c5a0 ; python_version >= '3.12'",
    "chemcensor @ git+https://github.com/insilicomedicine/ChemCensor.git@8990083aa815fbd71daa63f07f5a0c7c469f9850 ; python_version >= '3.12'",
    "setuptools<81 ; python_version >= '3.12'", # RXNMapper 0.4.2 imports pkg_resources and requests this compatibility pin
]

[tool.uv]
conflicts = [
    [
        { extra = "az" },
        { extra = "ursa" },
    ],
]

[project.urls]
Repository = "https://github.com/deepforestsci/DeepRetro"

[tool.setuptools.packages.find]
where = [".."]
include = ["deepretro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ty.analysis]
replace-imports-with-any = ["rdkit.**"]
