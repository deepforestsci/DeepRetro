[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepretro"
version = "0.1.0"
description = "DeepRetro package for retrosynthesis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "deepchem",
    "numpy",
    "rdkit",
    "structlog",
    "xgboost<2.0", # DeepChem GBDTModel uses XGBoost's sklearn wrapper; >=2.0 has breaking API changes
    "lightgbm",
    "scikit-learn",
    "pandas",
    "litellm",
    "python-dotenv",
    "langfuse<3",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
]
docs = [
    "sphinx>=8.0",
    "sphinx-rtd-theme>=3.0",
    "sphinx-autodoc-typehints>=3.0",
    "myst-parser>=4.0",
]
az = [
    "aizynthfinder>=4.4.0",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "pillow",
]

[project.urls]
Repository = "https://github.com/deepforestsci/DeepRetro"

[tool.setuptools]
# The project directory is also the import package; keep discovery local so
# source distributions can build wheels without the parent checkout.
packages = [
    "deepretro",
    "deepretro.agents",
    "deepretro.algorithms",
    "deepretro.data",
    "deepretro.featurizers",
    "deepretro.models",
    "deepretro.utils",
]
package-dir = {deepretro = "."}
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ty.analysis]
replace-imports-with-any = ["rdkit.**"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.isort]
known-first-party = ["deepretro"]
