[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepretro"
version = "0.1.0"
description = "DeepRetro package for retrosynthesis"
requires-python = ">=3.10"
dependencies = [
    "deepchem",
    "diskcache",
    "numpy",
    "rdkit",
    "structlog",
    "xgboost<4.0",  # DeepChem GBDTModel uses XGBoost's sklearn wrapper; >=2.0 has breaking API changes
    "lightgbm",
    "scikit-learn",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[project.urls]
Repository = "https://github.com/deepforestsci/DeepRetro"

[tool.setuptools.packages.find]
where = [".."]
include = ["deepretro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.ty.analysis]
replace-imports-with-any = ["rdkit.**"]
