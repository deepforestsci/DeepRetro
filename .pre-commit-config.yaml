repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/hoxbro/ty-pre-commit
    rev: v0.0.17
    hooks:
      - id: ty-check
        args: [--ignore, unresolved-import]
